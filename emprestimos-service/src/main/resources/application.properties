spring.application.name=emprestimos-service
server.port=8082
management.endpoints.web.exposure.include=health

# URL base do livros-service.
# Fora do Docker: http://localhost:8081
# Dentro do Docker: a variavel de ambiente LIVROS_SERVICE_URL (http://livros-service:8081) sobrescreve este valor.
livros.service.url=${LIVROS_SERVICE_URL:http://localhost:8081}
